
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Hundreds Chart</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;
  background: #fff;
  color: #222;
  font-family: Arial, sans-serif;
}

.activity {
  max-width: 650px;
  margin: 0 auto 28px;
}

.chart-wrap {
  width: 100%;
  overflow-x: auto;
  padding: 10px 0;
}

.chart {
  --cell: 52px;
  position: relative;
  width: calc(10 * var(--cell));
  height: calc(7 * var(--cell));
  margin: 0 auto;
}

.square {
  position: absolute;
  width: var(--cell);
  height: var(--cell);
  border: 1.5px solid #333;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
}

.square input {
  width: 100%;
  height: 100%;
  border: none;
  padding: 0;
  background: transparent;
  text-align: center;
  font: 19px Arial, sans-serif;
  color: #111;
}

.square input:focus {
  outline: 2px solid #3978b8;
  outline-offset: -3px;
}

.fixed {
  font-size: 19px;
  font-weight: bold;
  background: #f2f2f2;
}

.target {
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  padding: 0;
  color: #222;
}

.target:hover,
.target:focus-visible {
  border: 1px dashed #8aa6c2;
  background: #f1f7ff;
}

.target.active {
  border: 2px solid #36834a;
  background: #dceedd;
  font-size: 22px;
  font-weight: bold;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 12px 0;
  flex-wrap: wrap;
}

.action {
  padding: 10px 16px;
  border: 1px solid #aaa;
  border-radius: 6px;
  background: #f5f5f5;
  color: #222;
  font-size: 14px;
  cursor: pointer;
}

.action:hover {
  background: #e5e5e5;
}

.answer-area {
  max-width: 520px;
  margin: 14px auto;
}

.answer-area textarea {
  display: block;
  width: 100%;
  min-height: 65px;
  padding: 10px;
  border: 1px solid #bbb;
  border-radius: 5px;
  font: 14px Arial, sans-serif;
  resize: vertical;
}

.status {
  min-height: 20px;
  margin-top: 6px;
  font-size: 13px;
  text-align: center;
}

@media (max-width: 540px) {
  .chart {
    --cell: 42px;
  }

  .square input,
  .fixed {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<!-- FIRST CHART -->

<div class="activity">
  <div class="chart-wrap">
    <div id="chart12" class="chart"></div>
  </div>

  <div class="controls">
    <button class="action" type="button"
      onclick="reset12()">Reset</button>
    <button class="action" type="button"
      onclick="copy12()">Copy Answers</button>
  </div>

  <div class="answer-area">
    <textarea id="answer12" readonly
      aria-label="First chart answers"></textarea>
    <div id="status12" class="status"
      aria-live="polite"></div>
  </div>
</div>

<!-- SECOND CHART -->

<div class="activity">
  <div class="chart-wrap">
    <div id="chart13" class="chart"></div>
  </div>

  <div class="controls">
    <button class="action" type="button"
      onclick="reset13()">Reset</button>
    <button class="action" type="button"
      onclick="copy13()">Copy Answers</button>
  </div>

  <div class="answer-area">
    <textarea id="answer13" readonly
      aria-label="Second chart answers"></textarea>
    <div id="status13" class="status"
      aria-live="polite"></div>
  </div>
</div>

<script>

/*
  ORIGINAL WORKSHEET LAYOUT

  The visible cells correspond to:

                 17  18
                     28
                 37  38  39  40
             46
         55      57

  The square immediately below 18 is 28.

  All other hundreds-chart positions remain
  invisible unless selected in the second chart.
*/

const visibleNumbers = [
  17, 18,
  28,
  37, 38, 39, 40,
  46,
  55, 57
];

const fixedNumber = 18;

/*
  A hundreds chart has 10 columns.
  The first row is 1 to 10.
*/

function position(number) {
  return {
    col: (number - 1) % 10,
    row: Math.floor((number - 1) / 10)
  };
}

/*
  Move the chart contents upwards so
  the top visible row starts at the top.
*/

const rowOffset = 1;

function setPosition(element, number) {
  const pos = position(number);

  element.style.left =
    `calc(${pos.col} * var(--cell))`;

  element.style.top =
    `calc(${pos.row - rowOffset} * var(--cell))`;
}

/*
  Create one existing worksheet square.
*/

function makeSquare(number, mode) {
  const square = document.createElement("div");
  square.className = "square";

  setPosition(square, number);

  if (number === fixedNumber) {
    square.classList.add("fixed");
    square.textContent = "18";
  } else if (mode === "type") {
    const input = document.createElement("input");

    input.type = "text";
    input.inputMode = "numeric";
    input.maxLength = 3;
    input.dataset.position = number;

    input.setAttribute(
      "aria-label",
      "Missing number"
    );

    square.appendChild(input);
  }

  return square;
}

/*
  QUESTION 12:
  Fill in the missing numbers.
*/

function build12() {
  const chart = document.getElementById("chart12");
  chart.innerHTML = "";

  visibleNumbers.forEach(number => {
    chart.appendChild(
      makeSquare(number, "type")
    );
  });
}

/*
  QUESTION 13:
  Add three squares.

  The student chooses the positions.
  No correct answers are revealed.
*/

function build13() {
  const chart = document.getElementById("chart13");
  chart.innerHTML = "";

  // Draw original worksheet squares.
  visibleNumbers.forEach(number => {
    chart.appendChild(
      makeSquare(number, "display")
    );
  });

  // Create invisible clickable positions.
  for (let number = 1; number <= 70; number++) {

    if (visibleNumbers.includes(number)) {
      continue;
    }

    const square = document.createElement("button");

    square.type = "button";
    square.className = "square target";
    square.dataset.number = number;

    setPosition(square, number);

    square.setAttribute(
      "aria-label",
      "Add square at this position"
    );

    square.setAttribute("aria-pressed", "false");

    square.onclick = function() {

      // Remove a previously added square.
      if (square.classList.contains("active")) {
        square.classList.remove("active");
        square.textContent = "";
        square.setAttribute("aria-pressed", "false");
        return;
      }

      // Maximum of three added squares.
      const activeCount =
        chart.querySelectorAll(".target.active").length;

      if (activeCount >= 3) {
        return;
      }

      square.classList.add("active");
      square.textContent = "+";
      square.setAttribute("aria-pressed", "true");
    };

    chart.appendChild(square);
  }
}

/*
  RESET BUTTONS
*/

function reset12() {
  document.querySelectorAll("#chart12 input")
    .forEach(input => {
      input.value = "";
    });

  document.getElementById("answer12").value = "";
  document.getElementById("status12").textContent = "";
}

function reset13() {
  document.querySelectorAll("#chart13 .target")
    .forEach(square => {
      square.classList.remove("active");
      square.textContent = "";
      square.setAttribute("aria-pressed", "false");
    });

  document.getElementById("answer13").value = "";
  document.getElementById("status13").textContent = "";
}

/*
  COPY ANSWERS FOR CANVAS
*/

async function copyText(text, textareaId, statusId) {
  const area = document.getElementById(textareaId);
  const status = document.getElementById(statusId);

  area.value = text;

  try {
    await navigator.clipboard.writeText(text);

    status.textContent =
      "Copied! Paste into your Canvas answer.";
  } catch (error) {
    area.focus();
    area.select();

    status.textContent =
      "Copy this text and paste it into Canvas.";
  }
}

/*
  QUESTION 12 ANSWERS
*/

function copy12() {
  const answers = [
    ...document.querySelectorAll("#chart12 input")
  ]
  .map(input => {
    const value = input.value.trim();

    return value
      ? input.dataset.position + "=" + value
      : null;
  })
  .filter(Boolean);

  copyText(
    "Missing numbers: " + answers.join(", "),
    "answer12",
    "status12"
  );
}

/*
  QUESTION 13 ANSWERS
*/

function copy13() {
  const selected = [
    ...document.querySelectorAll(
      "#chart13 .target.active"
    )
  ].map(square => square.dataset.number);

  copyText(
    "Added squares at positions: " +
      selected.join(", "),
    "answer13",
    "status13"
  );
}

/*
  START ACTIVITIES
*/

build12();
build13();

</script>

</body>
</html>
