
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hundreds Chart Interactive</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;
  font-family: Arial, sans-serif;
  color: #222;
  background: white;
}

.activity {
  max-width: 650px;
  margin: 0 auto 28px;
}

.chart-wrap {
  width: 100%;
  overflow-x: auto;
  padding: 8px 0;
}

.chart {
  --cell: 48px;
  position: relative;
  width: calc(10 * var(--cell));
  height: calc(10 * var(--cell));
  margin: 0 auto;
}

.square {
  position: absolute;
  width: var(--cell);
  height: var(--cell);
  border: 1.5px solid #333;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
}

.square input {
  width: 100%;
  height: 100%;
  padding: 0;
  border: 0;
  background: transparent;
  text-align: center;
  font: 18px Arial, sans-serif;
  color: #111;
  outline-offset: -3px;
}

.fixed {
  font-size: 18px;
  font-weight: bold;
  background: #f0f0f0;
}

.target {
  border: 1px solid transparent;
  background: transparent;
  color: #222;
  font-size: 20px;
  cursor: pointer;
  padding: 0;
}

.target:hover,
.target:focus-visible {
  border: 1px dashed #8aa6c2;
  background: #f1f7ff;
}

.target.active {
  background: #dceedd;
  border: 2px solid #36834a;
  font-size: 20px;
  font-weight: bold;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 12px 0;
  flex-wrap: wrap;
}

button.action {
  padding: 10px 15px;
  border: 1px solid #aaa;
  border-radius: 6px;
  background: #f5f5f5;
  color: #222;
  cursor: pointer;
  font-size: 14px;
}

button.action:hover {
  background: #e5e5e5;
}

.answer-area {
  max-width: 520px;
  margin: 14px auto;
  text-align: center;
}

.answer-area textarea {
  display: block;
  width: 100%;
  min-height: 75px;
  margin-top: 8px;
  padding: 10px;
  border: 1px solid #bbb;
  border-radius: 5px;
  font-size: 14px;
  resize: vertical;
}

.status {
  min-height: 20px;
  font-size: 13px;
  color: #444;
  text-align: center;
}

@media (max-width: 540px) {
  .chart {
    --cell: 38px;
  }

  .square input,
  .fixed {
    font-size: 15px;
  }
}
</style>
</head>

<body>

<!-- FIRST INTERACTIVE CHART -->

<div class="activity">
  <div class="chart-wrap">
    <div id="chart12" class="chart"></div>
  </div>

  <div class="controls">
    <button class="action" type="button"
      onclick="reset12()">Reset</button>

    <button class="action" type="button"
      onclick="copy12()">Copy Answers</button>
  </div>

  <div class="answer-area">
    <textarea id="answer12" readonly
      aria-label="Answers for first chart"></textarea>

    <div id="status12" class="status"
      aria-live="polite"></div>
  </div>
</div>


<!-- SECOND INTERACTIVE CHART -->

<div class="activity">
  <div class="chart-wrap">
    <div id="chart13" class="chart"></div>
  </div>

  <div class="controls">
    <button class="action" type="button"
      onclick="reset13()">Reset</button>

    <button class="action" type="button"
      onclick="copy13()">Copy Answers</button>
  </div>

  <div class="answer-area">
    <textarea id="answer13" readonly
      aria-label="Answers for second chart"></textarea>

    <div id="status13" class="status"
      aria-live="polite"></div>
  </div>
</div>


<script>

// Visible squares in the starting chart.
// Change this array if the worksheet layout differs.
const visibleNumbers = [
  17, 18,
  27,
  36, 38, 39,
  46, 47,
  55, 57,
  65, 66, 67
];

const fixedNumber = 18;

// Calculate position on a standard hundreds chart.
function position(number) {
  return {
    col: (number - 1) % 10,
    row: Math.floor((number - 1) / 10)
  };
}

// Create an existing square.
function makeSquare(number, mode) {
  const pos = position(number);
  const square = document.createElement("div");

  square.className = "square";
  square.style.left =
    `calc(${pos.col} * var(--cell))`;
  square.style.top =
    `calc(${pos.row} * var(--cell))`;

  if (number === fixedNumber) {
    square.classList.add("fixed");
    square.textContent = "18";
  } else if (mode === "type") {
    const input = document.createElement("input");

    input.type = "text";
    input.inputMode = "numeric";
    input.maxLength = 3;
    input.dataset.position = number;

    input.setAttribute(
      "aria-label",
      "Missing number"
    );

    square.appendChild(input);
  }

  return square;
}


// BUILD FIRST CHART

function build12() {
  const chart = document.getElementById("chart12");
  chart.innerHTML = "";

  visibleNumbers.forEach(number => {
    chart.appendChild(makeSquare(number, "type"));
  });
}


// BUILD SECOND CHART

function build13() {
  const chart = document.getElementById("chart13");
  chart.innerHTML = "";

  // Draw the existing worksheet squares.
  visibleNumbers.forEach(number => {
    chart.appendChild(makeSquare(number, "display"));
  });

  // Create invisible clickable positions.
  for (let number = 1; number <= 100; number++) {

    if (visibleNumbers.includes(number)) {
      continue;
    }

    const pos = position(number);
    const square = document.createElement("button");

    square.type = "button";
    square.className = "square target";
    square.dataset.number = number;

    square.style.left =
      `calc(${pos.col} * var(--cell))`;
    square.style.top =
      `calc(${pos.row} * var(--cell))`;

    square.textContent = "";

    square.setAttribute(
      "aria-label",
      "Add a square at this position"
    );

    square.onclick = () => {

      // Remove an already selected square.
      if (square.classList.contains("active")) {
        square.classList.remove("active");
        square.textContent = "";
        return;
      }

      // Allow a maximum of three squares.
      const activeCount =
        chart.querySelectorAll(
          ".target.active"
        ).length;

      if (activeCount >= 3) {
        return;
      }

      // Add a square.
      square.classList.add("active");
      square.textContent = "+";
    };

    chart.appendChild(square);
  }
}


// RESET FIRST CHART

function reset12() {
  document.querySelectorAll("#chart12 input")
    .forEach(input => input.value = "");

  document.getElementById("answer12").value = "";
  document.getElementById("status12").textContent = "";
}


// RESET SECOND CHART

function reset13() {
  document.querySelectorAll("#chart13 .target")
    .forEach(square => {
      square.classList.remove("active");
      square.textContent = "";
    });

  document.getElementById("answer13").value = "";
  document.getElementById("status13").textContent = "";
}


// COPY TEXT INTO CLIPBOARD

async function copyText(text, textareaId, statusId) {
  const area = document.getElementById(textareaId);
  const status = document.getElementById(statusId);

  area.value = text;

  try {
    await navigator.clipboard.writeText(text);

    status.textContent =
      "Copied! Paste into your Canvas answer.";

  } catch (error) {
    area.focus();
    area.select();

    status.textContent =
      "Select and copy the text, then paste into Canvas.";
  }
}


// COPY FIRST CHART ANSWERS

function copy12() {
  const answers = [
    ...document.querySelectorAll("#chart12 input")
  ]
  .map(input => {
    const value = input.value.trim();

    return value
      ? input.dataset.position + "=" + value
      : null;
  })
  .filter(Boolean);

  copyText(
    "Missing numbers: " + answers.join(", "),
    "answer12",
    "status12"
  );
}


// COPY SECOND CHART ANSWERS

function copy13() {
  const selected = [
    ...document.querySelectorAll(
      "#chart13 .target.active"
    )
  ].map(square => square.dataset.number);

  copyText(
    "Added squares at positions: " +
      selected.join(", "),
    "answer13",
    "status13"
  );
}


// START BOTH CHARTS

build12();
build13();

</script>

</body>
</html>
