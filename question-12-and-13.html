
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hundreds Chart</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px;
  font-family: Arial, sans-serif;
  background: white;
  color: #222;
}

.activity {
  max-width: 620px;
  margin: 0 auto 30px;
}

.chart-scroll {
  overflow-x: auto;
  width: 100%;
}

.chart {
  --cell: 48px;
  position: relative;
  width: calc(10 * var(--cell));
  height: calc(10 * var(--cell));
  margin: 0 auto;
}

.chart.short {
  height: calc(6 * var(--cell));
}

.outline {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.cell-input, .fixed-number, .added {
  position: absolute;
  width: var(--cell);
  height: var(--cell);
  display: flex;
  justify-content: center;
  align-items: center;
  font: 18px Arial, sans-serif;
}

.cell-input {
  border: 0;
  background: transparent;
  text-align: center;
  padding: 0;
}

.cell-input:focus {
  outline: 2px solid #2876bd;
  outline-offset: -3px;
}

.fixed-number {
  pointer-events: none;
}

.click-cell {
  position: absolute;
  width: var(--cell);
  height: var(--cell);
  border: 0;
  background: transparent;
  cursor: crosshair;
  padding: 0;
}

.click-cell:hover,
.click-cell:focus-visible {
  outline: 1px dashed #82a7d1;
  outline-offset: -1px;
  background: rgba(70,140,220,.08);
}

.added {
  border: 2px solid #34844c;
  background: #e2f3e6;
  pointer-events: none;
  font-weight: bold;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 12px auto;
}

button.action, select {
  padding: 10px 14px;
  border: 1px solid #aaa;
  border-radius: 6px;
  background: #f5f5f5;
  color: #222;
  font: 14px Arial, sans-serif;
}

button.action {
  cursor: pointer;
}

button.action:hover {
  background: #e5e5e5;
}

.answer-area {
  max-width: 520px;
  margin: 12px auto;
}

.answer-area textarea {
  width: 100%;
  min-height: 65px;
  padding: 10px;
  border: 1px solid #bbb;
  border-radius: 5px;
  font: 14px Arial, sans-serif;
}

.status {
  min-height: 20px;
  margin-top: 5px;
  text-align: center;
  font-size: 13px;
}

@media (max-width: 520px) {
  .chart {
    --cell: 38px;
  }
  .cell-input, .fixed-number, .added {
    font-size: 15px;
  }
}
</style>
</head>

<body>

<div class="activity">
  <div class="chart-scroll">
    <div id="chart12" class="chart short"></div>
  </div>
  <div class="controls">
    <button class="action" type="button"
      onclick="reset12()">Reset</button>
    <button class="action" type="button"
      onclick="copy12()">Copy Answers</button>
  </div>
  <div class="answer-area">
    <textarea id="answer12" readonly></textarea>
    <div id="status12" class="status"></div>
  </div>
</div>

<div class="activity">
  <div class="controls">
    <select id="numberToAdd"
      aria-label="Choose number to add">
      <option value="9">9</option>
      <option value="15">15</option>
      <option value="59">59</option>
    </select>
  </div>

  <div class="chart-scroll">
    <div id="chart13" class="chart"></div>
  </div>

  <div class="controls">
    <button class="action" type="button"
      onclick="reset13()">Reset</button>
    <button class="action" type="button"
      onclick="copy13()">Copy Answers</button>
  </div>

  <div class="answer-area">
    <textarea id="answer13" readonly></textarea>
    <div id="status13" class="status"></div>
  </div>
</div>

<script>
const SIZE = 48;

// Worksheet positions, mapped from the photograph.
// Row 0 = 1-10, row 1 = 11-20, etc.
const existing = [
  17, 18, 28,
  37, 38, 39, 40,
  46, 55, 57
];

// Number positions used for entering answers.
// The original drawing includes some open cells.
const entryPositions = existing.filter(n => n !== 18);

// Coordinates in a 10-column hundreds chart.
function pos(n) {
  return {
    col: (n - 1) % 10,
    row: Math.floor((n - 1) / 10)
  };
}

function place(el, n, rowOffset = 0) {
  const p = pos(n);
  el.style.left =
    `calc(${p.col} * var(--cell))`;
  el.style.top =
    `calc(${p.row - rowOffset} * var(--cell))`;
}

// The outline is drawn from individual lines,
// not by creating complete boxes.
// This preserves the worksheet's open edges.
function drawOutline(chart, rowOffset) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.classList.add("outline");

  const width = 10 * SIZE;
  const height = (rowOffset === 1 ? 6 : 10) * SIZE;
  svg.setAttribute("viewBox",
    `0 0 ${width} ${height}`);
  svg.setAttribute("preserveAspectRatio", "none");

  function line(x1,y1,x2,y2) {
    const el = document.createElementNS(ns,"line");
    el.setAttribute("x1", x1 * SIZE);
    el.setAttribute("y1", (y1-rowOffset)*SIZE);
    el.setAttribute("x2", x2 * SIZE);
    el.setAttribute("y2", (y2-rowOffset)*SIZE);
    el.setAttribute("stroke","#333");
    el.setAttribute("stroke-width","1.5");
    svg.appendChild(el);
  }

  // Horizontal lines from the original worksheet.
  [
    [6,8,1],
    [6,8,2],
    [6,10,3],
    [6,7,4],
    [8,10,4],
    [5,7,5],
    [4,5,6],
    [6,7,6]
  ].forEach(([a,b,y]) => line(a,y,b,y));

  // Vertical lines from the original worksheet.
  [
    [6,1,2],
    [7,1,4],
    [8,1,4],
    [6,3,5],
    [9,3,4],
    [10,3,4],
    [5,4,6],
    [4,5,6],
    [7,5,6]
  ].forEach(([x,a,b]) => line(x,a,x,b));

  chart.appendChild(svg);
}

function add18(chart, offset) {
  const el = document.createElement("div");
  el.className = "fixed-number";
  el.textContent = "18";
  place(el,18,offset);
  chart.appendChild(el);
}

function build12() {
  const chart = document.getElementById("chart12");
  chart.innerHTML = "";
  drawOutline(chart,1);
  add18(chart,1);

  entryPositions.forEach(n => {
    const input = document.createElement("input");
    input.className = "cell-input";
    input.type = "text";
    input.inputMode = "numeric";
    input.maxLength = 3;
    input.dataset.position = n;
    input.setAttribute("aria-label",
      "Missing number");
    place(input,n,1);
    chart.appendChild(input);
  });
}

const placed = {};

function build13() {
  const chart = document.getElementById("chart13");
  chart.innerHTML = "";

  drawOutline(chart,0);
  add18(chart,0);

  // Clickable positions cover the full 1-100 chart.
  for(let n=1;n<=100;n++) {
    if(existing.includes(n)) continue;

    const button = document.createElement("button");
    button.type = "button";
    button.className = "click-cell";
    button.setAttribute("aria-label",
      "Place a square here");
    place(button,n);

    button.onclick = () => {
      const selected =
        document.getElementById("numberToAdd").value;

      // Clicking a position assigns the selected number.
      // Assigning it again moves the square.
      placed[selected] = n;
      renderAdded();
    };

    chart.appendChild(button);
  }

  renderAdded();
}

function renderAdded() {
  const chart = document.getElementById("chart13");

  chart.querySelectorAll(".added").forEach(el=>el.remove());

  Object.entries(placed).forEach(([number,location])=>{
    const el = document.createElement("div");
    el.className = "added";
    el.textContent = number;
    place(el,location);
    chart.appendChild(el);
  });
}

function reset12() {
  document.querySelectorAll("#chart12 input")
    .forEach(el=>el.value="");
  document.getElementById("answer12").value="";
  document.getElementById("status12").textContent="";
}

function reset13() {
  Object.keys(placed).forEach(key=>delete placed[key]);
  renderAdded();
  document.getElementById("answer13").value="";
  document.getElementById("status13").textContent="";
}

async function copyText(text,areaId,statusId) {
  const area=document.getElementById(areaId);
  const status=document.getElementById(statusId);
  area.value=text;

  try {
    await navigator.clipboard.writeText(text);
    status.textContent=
      "Copied! Paste into your Canvas answer.";
  } catch(e) {
    area.focus();
    area.select();
    status.textContent=
      "Copy this text and paste into Canvas.";
  }
}

function copy12() {
  const answers=[
    ...document.querySelectorAll("#chart12 input")
  ].map(el=>
    el.dataset.position+"="+el.value.trim()
  );

  copyText(
    "Missing numbers: "+answers.join(", "),
    "answer12","status12"
  );
}

function copy13() {
  const answers=["9","15","59"].map(n=>{
    return n+"="+(placed[n] || "not placed");
  });

  copyText(
    "Added squares: "+answers.join(", "),
    "answer13","status13"
  );
}

build12();
build13();
</script>
</body>
</html>
