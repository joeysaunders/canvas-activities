
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Hundreds Chart</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px;
  font-family: Arial, sans-serif;
  background: white;
  color: #222;
}

.activity {
  max-width: 650px;
  margin: 0 auto 25px;
}

.chart-wrap {
  overflow-x: auto;
  width: 100%;
}

.chart {
  position: relative;
  width: 540px;
  height: 350px;
  margin: 0 auto;
}

.chart svg {
  position: absolute;
  top: 0;
  left: 0;
  width: 540px;
  height: 350px;
  pointer-events: none;
}

.number-input {
  position: absolute;
  width: 50px;
  height: 50px;
  border: none;
  background: transparent;
  text-align: center;
  font-size: 18px;
  font-family: Arial, sans-serif;
  padding: 0;
}

.number-input:focus {
  outline: 2px solid #3678bd;
  outline-offset: -3px;
}

.fixed-number {
  position: absolute;
  width: 50px;
  height: 50px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 18px;
  pointer-events: none;
}

.add-square {
  position: absolute;
  width: 50px;
  height: 50px;
  border: 1.5px solid transparent;
  background: transparent;
  cursor: pointer;
  padding: 0;
}

.add-square:hover {
  background: rgba(50,120,200,0.08);
}

.add-square.selected {
  border: 2px solid #32804a;
  background: rgba(100,190,120,0.18);
}

.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 10px 0;
}

.action {
  padding: 10px 16px;
  border: 1px solid #aaa;
  border-radius: 6px;
  background: #f5f5f5;
  cursor: pointer;
  font-size: 14px;
}

.answer-area {
  max-width: 520px;
  margin: 10px auto;
}

.answer-area textarea {
  width: 100%;
  min-height: 65px;
  padding: 10px;
  border: 1px solid #bbb;
  border-radius: 5px;
  font: 14px Arial, sans-serif;
}

.status {
  min-height: 20px;
  margin-top: 5px;
  text-align: center;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="activity">
  <div class="chart-wrap">
    <div class="chart" id="chart12"></div>
  </div>

  <div class="controls">
    <button class="action" onclick="reset12()">
      Reset
    </button>
    <button class="action" onclick="copy12()">
      Copy Answers
    </button>
  </div>

  <div class="answer-area">
    <textarea id="answer12" readonly></textarea>
    <div class="status" id="status12"></div>
  </div>
</div>

<div class="activity">
  <div class="chart-wrap">
    <div class="chart" id="chart13"></div>
  </div>

  <div class="controls">
    <button class="action" onclick="reset13()">
      Reset
    </button>
    <button class="action" onclick="copy13()">
      Copy Answers
    </button>
  </div>

  <div class="answer-area">
    <textarea id="answer13" readonly></textarea>
    <div class="status" id="status13"></div>
  </div>
</div>

<script>

// Each cell is 50px.
// The visible worksheet begins at number 17.
// The top row represents numbers 11-20.

const SIZE = 50;
const LEFT = 20;

// Existing positions in the original worksheet.
const visibleNumbers = [
  17, 18,
  28,
  37, 38, 39, 40,
  46,
  55, 56, 57
];

// Convert hundreds-chart numbers to coordinates.
function coords(n) {
  const col = (n - 1) % 10;
  const row = Math.floor((n - 1) / 10) - 1;

  return {
    x: LEFT + col * SIZE,
    y: row * SIZE
  };
}

// Draw the exact outline pattern.
// Some cells intentionally have open edges.
function drawOutline(chart) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 540 350");
  svg.setAttribute("aria-hidden", "true");

  function line(x1, y1, x2, y2) {
    const el = document.createElementNS(ns, "line");
    el.setAttribute("x1", x1);
    el.setAttribute("y1", y1);
    el.setAttribute("x2", x2);
    el.setAttribute("y2", y2);
    el.setAttribute("stroke", "#333");
    el.setAttribute("stroke-width", "1.6");
    svg.appendChild(el);
  }

  function segment(c1, r1, c2, r2) {
    line(
      LEFT + c1 * SIZE,
      r1 * SIZE,
      LEFT + c2 * SIZE,
      r2 * SIZE
    );
  }

  // Top: 17 and 18.
  segment(6,0,8,0);
  segment(6,0,6,1);
  segment(7,0,7,2);
  segment(8,0,8,2);
  segment(6,1,8,1);

  // Square underneath 18 (28).
  // Bottom edge is intentionally open.
  segment(7,1,7,2);
  segment(8,1,8,2);

  // Middle row: 37, 38, 39, 40.
  segment(6,2,10,2);
  segment(6,2,6,3);
  segment(7,2,7,3);
  segment(8,2,8,3);
  segment(9,2,9,3);
  segment(10,2,10,3);

  // The centre bottom edge is open.
  segment(6,3,7,3);
  segment(8,3,10,3);

  // Staggered square below-left.
  segment(5,3,6,3);
  segment(5,3,5,4);
  segment(6,3,6,4);

  // Lower row and bottom section.
  segment(4,4,7,4);
  segment(4,4,4,5);
  segment(5,4,5,6);
  segment(6,4,6,6);
  segment(7,4,7,5);

  // Bottom left and bottom right squares.
  segment(3,5,6,5);
  segment(3,5,3,6);
  segment(4,5,4,6);
  segment(3,6,4,6);
  segment(6,5,7,5);
  segment(7,5,7,6);
  segment(6,6,7,6);

  chart.appendChild(svg);
}

// Add the fixed 18.
function addFixed18(chart) {
  const p = coords(18);
  const el = document.createElement("div");

  el.className = "fixed-number";
  el.textContent = "18";
  el.style.left = p.x + "px";
  el.style.top = p.y + "px";

  chart.appendChild(el);
}

// Question 12: number entry.
function build12() {
  const chart = document.getElementById("chart12");
  chart.innerHTML = "";

  drawOutline(chart);
  addFixed18(chart);

  visibleNumbers.forEach(n => {
    if (n === 18) return;

    const p = coords(n);
    const input = document.createElement("input");

    input.className = "number-input";
    input.type = "text";
    input.inputMode = "numeric";
    input.maxLength = 3;
    input.dataset.number = n;
    input.setAttribute("aria-label", "Missing number");

    input.style.left = p.x + "px";
    input.style.top = p.y + "px";

    chart.appendChild(input);
  });
}

// Question 13: students add three squares.
function build13() {
  const chart = document.getElementById("chart13");
  chart.innerHTML = "";

  drawOutline(chart);
  addFixed18(chart);

  // The clickable area is invisible until selected.
  for (let n = 11; n <= 70; n++) {
    if (visibleNumbers.includes(n)) continue;

    const p = coords(n);
    const button = document.createElement("button");

    button.type = "button";
    button.className = "add-square";
    button.dataset.number = n;
    button.style.left = p.x + "px";
    button.style.top = p.y + "px";
    button.setAttribute(
      "aria-label",
      "Add or remove square"
    );
    button.setAttribute("aria-pressed", "false");

    button.onclick = () => {
      if (button.classList.contains("selected")) {
        button.classList.remove("selected");
        button.setAttribute("aria-pressed", "false");
        return;
      }

      const count = chart.querySelectorAll(
        ".add-square.selected"
      ).length;

      if (count >= 3) return;

      button.classList.add("selected");
      button.setAttribute("aria-pressed", "true");
    };

    chart.appendChild(button);
  }
}

function reset12() {
  document.querySelectorAll("#chart12 input")
    .forEach(input => input.value = "");

  document.getElementById("answer12").value = "";
  document.getElementById("status12").textContent = "";
}

function reset13() {
  document.querySelectorAll("#chart13 .add-square")
    .forEach(button => {
      button.classList.remove("selected");
      button.setAttribute("aria-pressed", "false");
    });

  document.getElementById("answer13").value = "";
  document.getElementById("status13").textContent = "";
}

async function copyText(text, areaId, statusId) {
  const area = document.getElementById(areaId);
  const status = document.getElementById(statusId);

  area.value = text;

  try {
    await navigator.clipboard.writeText(text);
    status.textContent =
      "Copied! Paste into your Canvas answer.";
  } catch (e) {
    area.focus();
    area.select();
    status.textContent =
      "Copy the selected text and paste into Canvas.";
  }
}

function copy12() {
  const answers = [
    ...document.querySelectorAll("#chart12 input")
  ].map(input => {
    const value = input.value.trim();
    return input.dataset.number + "=" + value;
  });

  copyText(
    "Missing numbers: " + answers.join(", "),
    "answer12",
    "status12"
  );
}

function copy13() {
  const selected = [
    ...document.querySelectorAll(
      "#chart13 .add-square.selected"
    )
  ].map(button => button.dataset.number);

  copyText(
    "Added squares: " + selected.join(", "),
    "answer13",
    "status13"
  );
}

build12();
build13();

</script>
</body>
</html>
