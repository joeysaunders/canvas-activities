
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">
<title>MAB Drawing Board</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 10px;
  background: white;
}
.toolbar {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
button {
  padding: 12px 18px;
  font-size: 16px;
  border: 1px solid #aaa;
  border-radius: 8px;
  background: #f5f5f5;
  cursor: pointer;
}
button.active {
  background: #ddd0f4;
  border: 2px solid #7553ae;
}
canvas {
  display: block;
  width: 100%;
  height: 380px;
  border: 2px solid #aaa;
  border-radius: 8px;
  background: white;
  touch-action: none;
  box-sizing: border-box;
}
</style>
</head>

<body>

<div class="toolbar">
  <button id="pencil" class="active">
    Pencil
  </button>
  <button id="eraser">
    Eraser
  </button>
  <button id="clear">
    Clear drawing
  </button>
</div>

<canvas id="board"></canvas>

<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");

let drawing = false;
let tool = "pencil";
let lastX = 0;
let lastY = 0;

function resizeCanvas() {
  const old = document.createElement("canvas");
  old.width = canvas.width;
  old.height = canvas.height;

  if (canvas.width && canvas.height) {
    old.getContext("2d").drawImage(canvas, 0, 0);
  }

  const rect = canvas.getBoundingClientRect();
  const scale = window.devicePixelRatio || 1;

  canvas.width = rect.width * scale;
  canvas.height = rect.height * scale;

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  if (old.width && old.height) {
    ctx.drawImage(
      old, 0, 0,
      rect.width, rect.height
    );
  }
}

resizeCanvas();

function position(event) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top
  };
}

canvas.addEventListener("pointerdown", event => {
  drawing = true;
  canvas.setPointerCapture(event.pointerId);

  const p = position(event);
  lastX = p.x;
  lastY = p.y;

  ctx.beginPath();
  ctx.fillStyle =
    tool === "eraser" ? "white" : "black";
  ctx.arc(
    p.x, p.y,
    tool === "eraser" ? 12 : 2,
    0, Math.PI * 2
  );
  ctx.fill();
});

canvas.addEventListener("pointermove", event => {
  if (!drawing) return;

  const p = position(event);

  ctx.beginPath();
  ctx.strokeStyle =
    tool === "eraser" ? "white" : "black";
  ctx.lineWidth =
    tool === "eraser" ? 24 : 4;

  ctx.moveTo(lastX, lastY);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();

  lastX = p.x;
  lastY = p.y;
});

function stopDrawing() {
  drawing = false;
}

canvas.addEventListener("pointerup", stopDrawing);
canvas.addEventListener("pointercancel", stopDrawing);

function setTool(selected) {
  tool = selected;

  document.getElementById("pencil")
    .classList.toggle("active", tool === "pencil");

  document.getElementById("eraser")
    .classList.toggle("active", tool === "eraser");
}

document.getElementById("pencil")
  .onclick = () => setTool("pencil");

document.getElementById("eraser")
  .onclick = () => setTool("eraser");

document.getElementById("clear")
  .onclick = () => {
    ctx.clearRect(
      0, 0, canvas.width, canvas.height
    );
  };
</script>

</body>
</html>
